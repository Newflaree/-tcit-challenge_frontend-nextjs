name: Frontend CI

on:
  push:
    branches:
      - Development
      - main
      - 'feature/**'
  pull_request:
    branches:
      - Development
      - main

jobs:
  frontend:
    name: Frontend (Jest + Playwright)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (genera los tipos de Next)
        run: npm run build

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitarios con cobertura
        run: npm run test:cov

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e
